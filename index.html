<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fdf0f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Noviye">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Noviye 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;600;700&family=Noto+Sans+Ethiopic:wght@400;600;700&family=Noto+Serif+Ethiopic:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf0f4; --card:#ffffff; --field:#ffffff; --ink:#43303b; --soft:#9a7f8c; --line:#f3dbe4;
    --rose:#e7739f; --rose-soft:#fde1eb; --lav:#a98bdc; --lav-soft:#efe7fb;
    --peach:#f7a98b; --mint:#7cc5a6; --sky:#7fb6e8; --sky-soft:#e3f0fb; --track:#f8e9ef;
    --sans:Nunito,"Noto Sans Ethiopic",system-ui,sans-serif; --serif:Fraunces,"Noto Serif Ethiopic",Georgia,serif;
  }
  [data-theme=dark]{
    --bg:#1d1520; --card:#2a1f2e; --field:#231a27; --ink:#f6e8ef; --soft:#b9a1b0; --line:#3e2f43;
    --rose:#f08cb3; --rose-soft:#4b2a3c; --lav:#c3a8f2; --lav-soft:#372a4d;
    --sky-soft:#1f3346; --track:#3a2c3f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);min-height:100vh;padding:20px 16px 70px;transition:background .3s}
  .wrap{max-width:480px;margin:0 auto}
  h1,h2,.serif{font-family:var(--serif);font-weight:600}
  header{margin:6px 0 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  header .date{color:var(--soft);font-size:14px}
  header h1{font-size:26px;line-height:1.25;margin-top:2px}
  .hbtns{display:flex;gap:6px;flex-shrink:0}
  .hbtns button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;height:36px;min-width:36px;
    padding:0 10px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
  .tabs{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:999px;margin-bottom:16px;
    border:1px solid var(--line);position:sticky;top:8px;z-index:5;box-shadow:0 4px 14px rgba(231,115,159,.12)}
  .tabs button{flex:1;border:0;background:transparent;padding:9px 2px;border-radius:999px;font:inherit;font-weight:700;font-size:14px;color:var(--soft);cursor:pointer}
  .tabs button.on{background:var(--rose);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(231,115,159,.06)}
  .card h2{font-size:19px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .card h2 small{font-family:var(--sans);font-size:13px;font-weight:700;color:var(--rose);background:var(--rose-soft);padding:2px 10px;border-radius:999px;white-space:nowrap}
  .q{font-weight:700;margin-bottom:10px}
  .hint{color:var(--soft);font-size:14px;margin:-4px 0 12px}
  .label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;opacity:.85;margin-bottom:6px}
  .sub{font-size:13px;font-weight:700;color:var(--lav);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px}
  .sub:first-child{margin-top:0}

  .love{background:linear-gradient(135deg,var(--rose),var(--lav));color:#fff;border:0;padding:22px 20px;text-align:center}
  .love .serif{font-size:21px;line-height:1.4}
  .note{border:2px dashed var(--rose);background:var(--rose-soft)}
  .note .label{color:var(--rose)}
  .note p{font-size:17px}

  .summary{display:flex;gap:10px;margin-bottom:14px}
  .summary div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center}
  .summary b{display:block;font-family:var(--serif);font-size:22px;color:var(--rose)}
  .summary span{font-size:12px;color:var(--soft)}

  .check{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px dashed var(--line);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
  .check:last-child{border-bottom:0}
  .check .ico{font-size:20px;width:28px;text-align:center}
  .check .lbl{flex:1}
  .box{width:26px;height:26px;border-radius:9px;border:2px solid #efc3d4;display:flex;align-items:center;justify-content:center;
    transition:.15s;flex-shrink:0;color:#fff;font-size:15px;font-weight:700}
  .check.on .box{background:var(--rose);border-color:var(--rose)}
  .check.on .lbl{color:var(--soft);text-decoration:line-through}

  .water{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .drop{width:44px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--field);font-size:22px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;filter:grayscale(1);opacity:.45;transition:.15s}
  .drop.on{background:var(--sky-soft);border-color:var(--sky);filter:none;opacity:1}
  .wgoal{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:12px;font-size:14px;color:var(--soft)}
  .wgoal button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--field);font:inherit;cursor:pointer;color:var(--ink)}

  .challenge p{font-size:17px;margin-bottom:12px}
  .pill{border:2px solid var(--rose);background:transparent;color:var(--rose);border-radius:999px;padding:8px 18px;font:inherit;font-weight:700;cursor:pointer}
  .pill.on{background:var(--rose);color:#fff}
  .tip b{display:block;font-size:17px;margin-bottom:4px}
  .tip p{color:var(--soft);margin-bottom:14px}
  .calm{width:100%;border:0;background:var(--lav-soft);color:var(--ink);padding:13px;border-radius:14px;font:inherit;font-weight:700;cursor:pointer}

  .moods{display:flex;justify-content:space-between;gap:6px}
  .moods button{flex:1;font-size:27px;padding:9px 0;border-radius:14px;border:1px solid var(--line);background:var(--field);cursor:pointer;transition:.15s}
  .moods button.on{background:var(--rose-soft);border-color:var(--rose);transform:scale(1.06)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips button{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:7px 14px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer;transition:.15s}
  .chips button.on{background:var(--lav-soft);border-color:var(--lav);font-weight:700}
  .block{margin-bottom:20px}
  .good input{margin-bottom:8px}
  .toggle{display:flex;gap:6px;margin-bottom:12px}
  .toggle button{flex:1;border:1px solid var(--line);background:var(--field);padding:9px;border-radius:12px;font:inherit;font-size:15px;cursor:pointer;color:var(--soft)}
  .toggle button.on{border-color:var(--rose);background:var(--rose-soft);color:var(--ink);font-weight:700}
  textarea,input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;background:var(--field);color:var(--ink)}
  textarea{min-height:90px;resize:vertical}
  textarea:focus,input:focus{outline:2px solid var(--rose-soft);border-color:var(--rose)}
  ::placeholder{color:var(--soft);opacity:.8}
  .rec{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0}
  .recbtn{width:74px;height:74px;border-radius:50%;border:0;background:var(--rose);color:#fff;font-size:28px;cursor:pointer;box-shadow:0 4px 14px rgba(231,115,159,.4)}
  .recbtn.live{animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(231,115,159,.55)}50%{box-shadow:0 0 0 14px rgba(231,115,159,0)}}
  .rec .status{color:var(--soft);font-size:14px;text-align:center}
  audio{width:100%;margin-top:6px}
  .link{background:none;border:0;color:var(--rose);font:inherit;font-size:14px;font-weight:700;cursor:pointer;text-decoration:underline}
  .btn{width:100%;border:0;background:var(--rose);color:#fff;padding:14px;border-radius:14px;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
  .btn:disabled{opacity:.4;cursor:default}
  .done{text-align:center;padding:12px 4px}
  .done .big{font-size:38px}
  .done h2{display:block;font-size:21px;margin:6px 0}
  .done p{color:var(--soft)}

  .addrow{display:flex;gap:8px;margin-top:10px}
  .addrow input{flex:1;min-width:0}
  .addrow button{border:0;background:var(--lav);color:#fff;border-radius:12px;padding:0 16px;font:inherit;font-weight:700;font-size:20px;cursor:pointer}
  .task .del{border:0;background:none;color:var(--soft);opacity:.6;font-size:18px;cursor:pointer;padding:0 4px}
  .none{color:var(--soft);font-size:14px;padding:6px 4px}

  .hero{display:flex;align-items:center;gap:18px}
  .ring{position:relative;width:110px;height:110px;flex-shrink:0}
  .ring svg{transform:rotate(-90deg)}
  .ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .ring b{font-family:var(--serif);font-size:28px;line-height:1}
  .ring span{font-size:11px;color:var(--soft)}
  .aspect{margin-bottom:14px}
  .aspect:last-child{margin-bottom:0}
  .aspect .row{display:flex;justify-content:space-between;font-size:15px;margin-bottom:5px;gap:8px}
  .aspect .row span{color:var(--soft);font-size:14px;white-space:nowrap}
  .bar{height:10px;background:var(--track);border-radius:999px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:999px;transition:width .5s}
  .days{display:flex;justify-content:space-between;align-items:flex-end;height:120px;gap:6px}
  .days .d{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--soft)}
  .days .col{width:100%;max-width:30px;background:linear-gradient(180deg,var(--rose),var(--lav));border-radius:8px 8px 4px 4px;min-height:4px;margin-bottom:4px}
  .days .em{font-size:16px;height:22px}
  .stats{display:flex;gap:10px;margin-bottom:14px}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 4px;text-align:center}
  .stat b{display:block;font-family:var(--serif);font-size:24px;color:var(--rose)}
  .stat span{color:var(--soft);font-size:12px}

  .entry .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .entry .m{font-size:24px}
  .qa{font-size:14px;margin-bottom:4px}
  .qa span{color:var(--soft)}
  .entry .sec{font-size:13px;font-weight:700;color:var(--lav);margin:10px 0 2px}
  .entry ul{padding-left:20px}
  .empty{text-align:center;color:var(--soft);padding:28px 10px}
  .namebox{display:flex;gap:8px;margin-top:10px}
  .namebox input{flex:1;min-width:0}
  .namebox button{border:0;background:var(--rose);color:#fff;border-radius:12px;padding:0 16px;font:inherit;font-weight:700;cursor:pointer}
  .foot{text-align:center;color:var(--soft);font-size:13px;margin-top:20px}
  .hidden{display:none!important}

  .daynav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .daynav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:22px;cursor:pointer}
  .daynav button:disabled{opacity:.3;cursor:default}
  .daynav div{text-align:center;flex:1}
  .daynav b{display:block;font-size:16px}
  .daynav span{font-size:13px;color:var(--rose);font-weight:700}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);
    padding:9px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .ntop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
  .ntop .del{border:0;background:none;color:var(--soft);font:inherit;font-size:13px;cursor:pointer}
  .ntop .del.armed{color:#fff;background:#d9534f;border-radius:999px;padding:2px 10px}
  .ntxt{white-space:pre-wrap}

  /* breathing overlay */
  #breathe{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  .orb{width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6,transparent 60%),linear-gradient(135deg,var(--rose),var(--lav));
    transform:scale(.55);box-shadow:0 0 60px rgba(231,115,159,.35);margin:30px 0}
  #bText{font-family:var(--serif);font-size:26px;min-height:40px}
  #bSub{color:var(--soft);margin-top:8px}
  .bbtns{display:flex;gap:10px;margin-top:26px}
  .bbtns button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 22px;font:inherit;font-weight:700;cursor:pointer}
</style>
<link rel="stylesheet" href="gentle.css?v=1795084959">

<script>try{if(localStorage.getItem("novi:pin-hash"))document.documentElement.classList.add("locked")}catch(e){}</script>

<body>
<div class="wrap">

  <header>
    <div>
      <div class="date" id="date"></div>
      <h1 id="greet"></h1>
    </div>
    <div class="hbtns">
      <button id="langBtn" aria-label="Language">አማ</button>
      <button id="themeBtn" aria-label="Dark mode">🌙</button>
    </div>
  </header>

  <div class="card hidden" id="welcome">
    <div class="q" data-i="welcomeTitle"></div>
    <p class="hint" style="margin:0" data-i="welcomeBody"></p>
    <div class="namebox">
      <input id="nameIn" data-ph="namePh" maxlength="30">
      <button id="nameBtn" data-i="start"></button>
    </div>
  </div>

  <nav class="tabs">
    <button class="on" data-tab="today" data-i="today"></button>
    <button data-tab="tasks" data-i="tasks"></button>
    <button data-tab="progress" data-i="progress"></button>
    <button data-tab="journal" data-i="journal"></button>
  </nav>

  <!-- ================= TODAY ================= -->
  <section id="today">
    <div class="daynav">
      <button id="prevDay" aria-label="Previous day">‹</button>
      <div><b id="viewLabel"></b><span id="pastHint" class="hidden" data-i="pastHint"></span></div>
      <button id="nextDay" aria-label="Next day">›</button>
    </div>
    <div class="card love">
      <div class="label" data-i="loveLabel"></div>
      <div class="serif" id="love"></div>
    </div>

    <div class="card note hidden" id="noteCard">
      <div class="label" id="noteFrom"></div>
      <p id="noteText"></p>
    </div>

    <div class="summary">
      <div><b id="sRoutine">0/10</b><span data-i="sRoutine"></span></div>
      <div><b id="sWater">0/8</b><span data-i="sWater"></span></div>
      <div><b id="sTasks">0/0</b><span data-i="sTasks"></span></div>
    </div>

    <div class="card">
      <h2><span data-i="routineTitle"></span> <small id="routinePct">0%</small></h2>
      <div id="routine"></div>
    </div>

    <div class="card">
      <h2><span data-i="waterTitle"></span> <small id="waterTxt">0 / 8</small></h2>
      <div class="water" id="water"></div>
      <div class="wgoal"><span data-i="goal"></span> <button id="wMinus">−</button><b id="wGoal">8</b><button id="wPlus">+</button> <span data-i="glasses"></span></div>
    </div>

    <div class="card challenge">
      <div class="label" style="color:var(--rose)" data-i="challengeLabel"></div>
      <p id="challenge"></p>
      <button class="pill" id="challengeBtn"></button>
    </div>

    <div class="card tip">
      <div class="label" style="color:var(--lav)" data-i="tipLabel"></div>
      <b id="tipTitle"></b>
      <p id="tipBody"></p>
      <button class="calm" id="calmBtn" data-i="calmBtn"></button>
    </div>

    <div class="card">
      <h2 data-i="checkinTitle"></h2>
      <div id="form">
        <div class="block">
          <div class="q" data-i="moodQ"></div>
          <div class="moods" id="moods">
            <button data-v="1">😔</button><button data-v="2">😕</button><button data-v="3">😐</button>
            <button data-v="4">🙂</button><button data-v="5">😊</button>
          </div>
        </div>
        <div id="dailyQs"></div>
        <div class="block good">
          <div class="q" data-i="goodQ"></div>
          <input id="g1" data-ph="good1" maxlength="120">
          <input id="g2" data-ph="good2" maxlength="120">
          <input id="g3" data-ph="good3" maxlength="120">
        </div>
        <div class="block">
          <div class="q" data-i="learnedQ"></div>
          <p class="hint" data-i="learnedHint"></p>
          <div class="toggle">
            <button class="on" data-mode="text" data-i="write"></button>
            <button data-mode="voice" data-i="voice"></button>
          </div>
          <div id="textMode"><textarea id="text" data-ph="textPh"></textarea></div>
          <div id="voiceMode" class="hidden">
            <div class="rec" id="recWrap">
              <button class="recbtn" id="recBtn" aria-label="Record">🎙️</button>
              <div class="status" id="recStatus"></div>
            </div>
            <div id="playback" class="hidden">
              <audio id="audio" controls></audio>
              <div style="text-align:center;margin-top:6px"><button class="link" id="delAudio" data-i="delRec"></button></div>
            </div>
          </div>
        </div>
        <button class="btn" id="save" disabled data-i="save"></button>
      </div>
      <div class="done hidden" id="done">
        <div class="big">🌸</div>
        <h2 data-i="thanks"></h2>
        <p id="doneMsg"></p>
        <p style="margin-top:12px"><button class="link" id="edit" data-i="edit"></button></p>
      </div>
    </div>
  </section>

  <!-- ================= TASKS ================= -->
  <section id="tasks" class="hidden">
    <div class="card">
      <h2><span data-i="todayTasks"></span> <small id="dailyCount">0/0</small></h2>
      <div id="dailyList"></div>
      <form class="addrow" data-kind="daily"><input data-ph="addDaily" maxlength="80"><button>+</button></form>
    </div>
    <div class="card">
      <h2><span data-i="weekTasks"></span> <small id="weeklyCount">0/0</small></h2>
      <div id="weeklyList"></div>
      <form class="addrow" data-kind="weekly"><input data-ph="addWeekly" maxlength="80"><button>+</button></form>
    </div>
    <p class="foot" style="margin-top:0" data-i="rollNote"></p>
  </section>

  <!-- ================= PROGRESS ================= -->
  <section id="progress" class="hidden">
    <div class="card">
      <div class="hero">
        <div class="ring">
          <svg width="110" height="110" viewBox="0 0 110 110">
            <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#e7739f"/><stop offset="1" stop-color="#a98bdc"/></linearGradient></defs>
            <circle cx="55" cy="55" r="46" fill="none" stroke="var(--track)" stroke-width="12"/>
            <circle id="ringArc" cx="55" cy="55" r="46" fill="none" stroke="url(#g)" stroke-width="12" stroke-linecap="round"
              stroke-dasharray="289" stroke-dashoffset="289" style="transition:stroke-dashoffset .6s"/>
          </svg>
          <div><b id="overall">0%</b><span data-i="thisWeek"></span></div>
        </div>
        <p id="insight"></p>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b id="streak">0</b><span data-i="streak"></span></div>
      <div class="stat"><b id="avgMood">–</b><span data-i="avgMood"></span></div>
      <div class="stat"><b id="avgWater">0</b><span data-i="perDay"></span></div>
    </div>
    <div class="card">
      <h2 data-i="last7"></h2>
      <div class="days" id="days"></div>
      <p class="hint" style="margin:10px 0 0;text-align:center" data-i="barsHint"></p>
    </div>
    <div class="card">
      <h2 data-i="howDoing"></h2>
      <div id="aspects"></div>
    </div>
  </section>

  <!-- ================= JOURNAL ================= -->
  <section id="journal" class="hidden">
    <div class="card">
      <h2 data-i="noteTitle"></h2>
      <p class="hint" data-i="noteHint"></p>
      <input id="nTitle" data-ph="noteTitlePh" maxlength="80" style="margin-bottom:10px">
      <div class="toggle">
        <button class="on" data-nmode="text" data-i="write"></button>
        <button data-nmode="voice" data-i="voice"></button>
      </div>
      <div id="nTextMode"><textarea id="nText" data-ph="notePh"></textarea></div>
      <div id="nVoiceMode" class="hidden">
        <div class="rec" id="nRecWrap">
          <button class="recbtn" id="nRecBtn" aria-label="Record">🎙️</button>
          <div class="status" id="nRecStatus"></div>
        </div>
        <div id="nPlayback" class="hidden">
          <audio id="nAudio" controls></audio>
          <div style="text-align:center;margin-top:6px"><button class="link" id="nDelAudio" data-i="delRec"></button></div>
        </div>
      </div>

const S = {days:{}, tasks:[], notes:[]};
let db = null;
function openDB(){
  return new Promise(res=>{
    try{
      const r = indexedDB.open("novi-day",2);
      r.onupgradeneeded = () => {
        const x = r.result;
        if(!x.objectStoreNames.contains("days")) x.createObjectStore("days",{keyPath:"date"});
        if(!x.objectStoreNames.contains("tasks")) x.createObjectStore("tasks",{keyPath:"id"});
        if(!x.objectStoreNames.contains("notes")) x.createObjectStore("notes",{keyPath:"id"});
      };
      r.onsuccess = () => res(r.result); r.onerror = () => res(null);
    }catch(e){ res(null); }
  });
}
const getAll = store => new Promise((res,reject)=>{
  try{ const r = db.transaction(store).objectStore(store).getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>reject(r.error); }catch(e){ reject(e); }
});
async function writeRecord(store, value, remove=false){
  if(!db){ storageProblem(); return false; }
  return new Promise(resolve=>{
    try{
      const tx=db.transaction(store,"readwrite");
      if(remove) tx.objectStore(store).delete(value); else tx.objectStore(store).put(value);
      tx.oncomplete=()=>resolve(true);
      tx.onerror=tx.onabort=()=>{ storageProblem(); resolve(false); };
    }catch(e){ storageProblem(); resolve(false); }
  });
}
const put = (store,obj)=>writeRecord(store,obj);
const del = (store,key)=>writeRecord(store,key,true);

           "🎙️ ለግልጽ ድምፅ የስልኩ ማይክሮፎን እየተጠቀምን ነው። ስልኩን አቅርቢው።")
      : tr("Earphone mics often sound less clear. If you can, pick your phone's microphone below.",
           "የጆሮ ማዳመጫ ማይክሮፎን ብዙ ጊዜ ግልጽ አይደለም። ከተቻለ ከታች የስልኩን ማይክሮፎን ምረጪ።");
    if(sel.options[0]) sel.options[0].textContent = tr("Microphone: automatic","ማይክሮፎን፦ ራስ-ሰር");
  }
  R.idleText = ui;
  R.show = blob => {
    R.blob = blob;
    if(R.url) URL.revokeObjectURL(R.url); R.url = blob ? URL.createObjectURL(blob) : null;
    if(R.url) audioEl.src = R.url; else audioEl.removeAttribute("src");
    ($("Playback")||$("playback")).classList.toggle("hidden", !blob);
    wrap.classList.toggle("hidden", !!blob);
  };
  async function listMics(){
    try{
      const ds = (await navigator.mediaDevices.enumerateDevices())
        .filter(d=>d.kind==="audioinput" && d.label && !["default","communications"].includes(d.deviceId));
      if(ds.length<2){ sel.classList.add("hidden"); return; }
      sel.replaceChildren(new Option("", ""), ...ds.map(d=>new Option(d.label, d.deviceId)));
      sel.value = ds.some(d=>d.deviceId===lsGet("mic-id")) ? lsGet("mic-id") : "";
      sel.classList.remove("hidden"); ui();
    }catch(e){}
  }
  sel.onchange = () => lsSet("mic-id", sel.value);
  if(canRecord){ listMics(); try{ navigator.mediaDevices.addEventListener("devicechange", listMics); }catch(e){} }
  const lock = async () => { try{ wake = await navigator.wakeLock.request("screen"); }catch(e){ wake = null; } };
  const unlock = () => { try{ wake && wake.release(); }catch(e){} wake = null; };
  const tick = () => { clearInterval(timer); timer = setInterval(()=>{ secs++; ui(); if(secs>=MAX_REC) R.rec.stop(); },1000); };
  function pause(msg){
    if(state()!=="recording") return;
    try{ R.rec.requestData(); }catch(e){}
    R.rec.pause(); clearInterval(timer); unlock(); note = msg || ""; ui();
  }
  function resume(){
    const track = stream && stream.getAudioTracks()[0];
    if(!track || track.readyState!=="live"){ lostMsg = tr("The microphone was taken away, so your recording was kept up to that point.","ማይክሮፎኑ ስለተወሰደ እስከዚያ ድረስ የተቀዳው ተቀምጧል።"); R.rec.stop(); return; }
    R.rec.resume(); note = ""; tick(); lock(); ui();
  }
  async function start(){
    // Like WhatsApp: no "call mode" processing (that switches Android to the Bluetooth call mic),
    // and prefer the phone's own microphone even when earphones are connected.
    const audio = {echoCancellation:false, noiseSuppression:false, autoGainControl:false, channelCount:{ideal:1}, sampleRate:{ideal:48000}};
    let chosen = lsGet("mic-id");
    if(!chosen){
      let ds = await inputs();
      if(!ds.some(d=>d.label)){ // first time: ask permission once so device names become visible
        try{ const probe = await navigator.mediaDevices.getUserMedia({audio:true}); probe.getTracks().forEach(x=>x.stop()); }catch(e){ status.textContent = t("noMic"); return; }
        ds = await inputs();
      }
      const phone = ds.find(d=>!isBT(d.label) && !["default","communications"].includes(d.deviceId));
      if(phone && ds.some(d=>isBT(d.label))){ chosen = phone.deviceId; usingPhoneMic = true; } else usingPhoneMic = false;
    }
    if(chosen) audio.deviceId = {exact:chosen};
    try{ stream = await navigator.mediaDevices.getUserMedia({audio}); }
    catch(e){
      if(chosen){ if(lsGet("mic-id")) lsSet("mic-id",""); delete audio.deviceId;
        try{ stream = await navigator.mediaDevices.getUserMedia({audio}); }catch(e2){ status.textContent = t("noMic"); return; } }
      else { status.textContent = t("noMic"); return; }
    }
    listMics();
    const track = stream.getAudioTracks()[0];
    tip.dataset.mode = usingPhoneMic ? "phone" : "bt";
    tip.classList.toggle("hidden", !(usingPhoneMic || isBT(track.label)));
    // A phone call (or another app) can mute or take the mic: pause, or keep what was recorded.
    track.onmute = () => pause(tr("A call or another app used the microphone.","ጥሪ ወይም ሌላ መተግበሪያ ማይክሮፎኑን ተጠቀመ።"));
    track.onended = () => { if(state()!=="inactive"){ lostMsg = tr("The microphone was taken away, so your recording was kept up to that point.","ማይክሮፎኑ ስለተወሰደ እስከዚያ ድረስ የተቀዳው ተቀምጧል።"); R.rec.stop(); } };
    const ty = pickType();
    try{ R.rec = new MediaRecorder(stream, Object.assign({audioBitsPerSecond:96000}, ty ? {mimeType:ty} : {})); }
    catch(e){ R.rec = ty ? new MediaRecorder(stream,{mimeType:ty}) : new MediaRecorder(stream); }
    chunks = [];
    R.rec.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
    R.rec.onstop = () => {
      clearInterval(timer); unlock(); stream.getTracks().forEach(x=>x.stop()); note = "";
      const blob = new Blob(chunks,{type:(R.rec && R.rec.mimeType) || ty || "audio/webm"});
      ui(); R.show(blob.size ? blob : null);
      if(!p && typeof persistDraft==="function") persistDraft();
      if(lostMsg){ toast(lostMsg); lostMsg = ""; }
    };
    R.rec.start(1000);   // save a piece every second so an interruption never loses everything
    secs = 0; note = ""; tick(); lock(); ui();
  }
  document.addEventListener("visibilitychange", () => {
    if(document.hidden) pause(tr("You left the page.","ከገጹ ወጥተሽ ነበር።"));
  });
  btn.onclick = () => { const s = state(); if(s==="recording") R.rec.stop(); else if(s==="paused") resume(); else start(); };
  extra.onclick = () => { const s = state(); if(s==="recording") pause(""); else if(s==="paused") R.rec.stop(); };
  ($("DelAudio")||$("delAudio")).onclick = () => R.show(null);
  return R;
}

  const steps = [["breatheIn",4000,1],["hold",4000,1],["breatheOut",6000,.55]];

    document.getElementById("bAgain").classList.remove("hidden"); }, at));

/* ================= progress ================= */
const pct = (a,b) => b ? Math.round(a/b*100) : null;
function renderProgress(){
  const all = Object.keys(S.days).sort();
  const since = Math.floor((fromKey(TODAY)-fromKey(all[0]||TODAY))/864e5)+1;
  const N = Math.max(1, Math.min(7, since));
  const keys = lastDays(N);
  const ds = keys.map(k=>S.days[k] || {routine:{}, water:0});
  const cnt = ids => ds.reduce((s,d)=>s+ids.filter(i=>d.routine && d.routine[i]).length,0);
  const doneT = S.tasks.filter(x=>x.done && keys.includes(x.doneDate)).length;
  const openT = S.tasks.filter(x=>!x.done && ((x.kind==="daily"&&x.period===TODAY)||(x.kind==="weekly"&&x.period===WEEK))).length;
  const checked = ds.filter(d=>d.checkin);
  const waterSum = ds.reduce((s,d)=>s+(d.water||0),0);
  const pr = cnt(["prayAM","prayPM"]), me = cnt(["breakfast","lunch","dinner"]), he = cnt(["exercise","sleptOnTime","selfcare","family","oneThing"]);
  const ch = ds.filter(d=>d.challenge).length;
  const A = [
    {k:"aPrayer", v:pct(pr,2*N), note:`${pr}/${2*N}`, c:"var(--lav)"},
    {k:"aMeals", v:pct(me,3*N), note:`${me}/${3*N}`, c:"var(--peach)"},
    {k:"aWater", v:pct(ds.reduce((s,d)=>s+Math.min(d.water||0,waterGoal),0), waterGoal*N), note:t("nGlasses")(waterSum), c:"var(--sky)"},
    {k:"aHealth", v:pct(he,5*N), note:`${he}/${5*N}`, c:"var(--mint)"},
    {k:"aChallenge", v:pct(ch,N), note:`${ch}/${N}`, c:"#f2a0c4"},
    {k:"aTasks", v:pct(doneT,doneT+openT), note:(doneT+openT) ? t("nTasks")(doneT,openT) : t("noTasksYet"), c:"var(--rose)"},
    {k:"aCheckins", v:pct(checked.length,N), note:`${checked.length}/${N}`, c:"#d98bc4"}
  ];
  const valid = A.filter(a=>a.v!==null);
  const overall = valid.length ? Math.round(valid.reduce((s,a)=>s+a.v,0)/valid.length) : 0;
  document.getElementById("overall").textContent = overall+"%";
  document.getElementById("ringArc").style.strokeDashoffset = 289*(1-overall/100);

  const name = k => t(k).replace(/^\S+\s/,"");
  if(all.length && valid.some(a=>a.v>0)){
    const s = [...valid].sort((a,b)=>b.v-a.v), best = s[0], low = s[s.length-1];
    document.getElementById("insight").innerHTML = best.v===low.v ? t("balance") : t("insight")(name(best.k), name(low.k));
  } else document.getElementById("insight").textContent = t("insightEmpty");

  const have = new Set(all.filter(k=>S.days[k].checkin));
  const d = new Date(now); if(!have.has(keyOf(d))) d.setDate(d.getDate()-1);
  let streak = 0; while(have.has(keyOf(d))){ streak++; d.setDate(d.getDate()-1); }
  document.getElementById("streak").textContent = streak;
  document.getElementById("avgMood").textContent = checked.length ? MOODS[Math.round(checked.reduce((s,x)=>s+Number(x.mood),0)/checked.length)] : "–";
  document.getElementById("avgWater").textContent = (waterSum/N).toFixed(1).replace(/\.0$/,"");

  const daysBox = document.getElementById("days"); daysBox.innerHTML = "";
  lastDays(7).forEach(k=>{
    const x = S.days[k], r = x ? ALL_ITEMS.filter(i=>x.routine && x.routine[i]).length/ALL_ITEMS.length : 0;
    const c = document.createElement("div"); c.className = "d";
    c.innerHTML = `<div class="em">${x && x.mood ? MOODS[x.mood] : ""}</div><div class="col" style="height:${Math.max(4,r*80)}px;opacity:${r?1:.25}"></div>${fromKey(k).toLocaleDateString(LOC(),{weekday:"short"})}`;
    daysBox.appendChild(c);
  });

  const ab = document.getElementById("aspects"); ab.innerHTML = "";
  A.forEach(a=>{
    const el = document.createElement("div"); el.className = "aspect";
    el.innerHTML = `<div class="row"><b>${t(a.k)}</b><span>${a.note}${a.v!==null?` · ${a.v}%`:""}</span></div><div class="bar"><i style="width:${a.v||0}%;background:${a.c}"></i></div>`;
    ab.appendChild(el);
  });
}

/* ================= journal ================= */
function renderJournal(){
  const box = document.getElementById("entries"); box.innerHTML = "";
  const items = [
    ...Object.values(S.days).filter(d=>d.checkin).map(d=>({kind:"c", date:d.date, sort:d.date+"~", d})),
    ...S.notes.map(n=>({kind:"n", date:n.date, sort:n.date+" "+String(n.created).padStart(15,"0"), n}))
  ].sort((a,b)=>b.sort.localeCompare(a.sort));
  if(!items.length){ box.innerHTML = `<div class="card empty">${t("journalEmpty")}</div>`; return; }
  const dfmt = k => fromKey(k).toLocaleDateString(LOC(),{weekday:"short",day:"numeric",month:"short"});
  items.forEach(it=>{
    const c = document.createElement("div"); c.className = "card entry";
    if(it.kind==="n"){
      const n = it.n;
      const time = new Date(n.created).toLocaleTimeString(LOC(),{hour:"numeric",minute:"2-digit"});
      c.innerHTML = `<div class="ntop"><span class="hint" style="margin:0">${t("noteTag")} · ${dfmt(n.date)}, ${time}</span><button class="del">${t("del")}</button></div>
        ${n.title ? `<b style="display:block;margin-bottom:4px">${esc(n.title)}</b>` : ""}${n.text ? `<div class="ntxt">${esc(n.text)}</div>` : ""}`;
      if(n.audio){ const a = document.createElement("audio"); a.controls = true; a.src = URL.createObjectURL(n.audio); c.appendChild(a); }
      const db_ = c.querySelector(".del");
      db_.onclick = async () => {
        if(!db_.classList.contains("armed")){ db_.classList.add("armed"); db_.textContent = t("deleteQ");
          setTimeout(()=>{ db_.classList.remove("armed"); db_.textContent = t("del"); }, 3000); return; }
        if(!await del("notes",n.id)) return; S.notes = S.notes.filter(x=>x.id!==n.id); renderJournal();
      };
    } else {
      const e = it.d;
      const qa = Object.entries(e.answers||{}).map(([id,i])=>{
        const q = QUESTIONS.find(x=>x.id===id); if(!q) return "";
        const [text,opts] = q[lang]; return `<div class="qa"><span>${esc(text)}</span> <b>${esc(opts[i]||"")}</b></div>`;
      }).join("");
      c.innerHTML = `<div class="top"><b>${t("checkinTag")} · ${dfmt(e.date)}</b><span class="m">${MOODS[e.mood]||""}</span></div>
        ${e.need && needIds.includes(e.need) ? `<div class="qa"><span>${g("savedNeed")}</span> <b>${esc(g("needs")[needIds.indexOf(e.need)])}</b></div>` : ""}${qa}
        ${(e.good&&e.good.length) ? `<div class="sec">${t("goodThings")}</div><ul>${e.good.map(g=>`<li>${esc(g)}</li>`).join("")}</ul>` : ""}
        ${(e.text||e.audio) ? `<div class="sec learned">${t("learned")}</div>` : ""}${e.text ? `<div class="ntxt">${esc(e.text)}</div>` : ""}
        ${e.challenge ? `<div class="sec">${t("challengeTag")}</div>` : ""}`;
      if(e.audio){ const a = document.createElement("audio"); a.controls = true; a.src = URL.createObjectURL(e.audio);
        const l = c.querySelector(".learned"); const txt = l && l.nextElementSibling && l.nextElementSibling.classList.contains("ntxt") ? l.nextElementSibling : l;
        txt ? txt.after(a) : c.appendChild(a); }
    }
    box.appendChild(c);
  });
}
